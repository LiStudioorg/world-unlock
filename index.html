<style>
    * { box-sizing: border-box; }

        --bg: #f2f2f2;

        --surface-2: #f7f7f7;

        --border: #d8d8d8;
        --error: #b3261e;
        --error-bg: #fdecea;

        --warning: #8a4b00;

        --progress-bg: #e3e3e3;
        --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    [data-theme="dark"] {
        --bg: #0e0e0e;
        --surface: #1a1a1a;
        --surface-2: #242424;
        --text: #f2f2f2;
        --text-2: #aaaaaa;

        --on-primary: #111111;

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;

        line-height: 1.6;
        transition: background 0.2s, color 0.2s;
        display: flex;
        flex-direction: column;
    }

    .topbar {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
        z-index: 10;
    }

    .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, transform 0.1s;
        box-shadow: var(--shadow);
    }

    .icon-btn:hover { transform: translateY(-1px); }
    .icon-btn:active { transform: translateY(0); }

    .container {

        margin: 0 0 8px;

    .subtitle {
        text-align: center;

        font-size: 0.9rem;

    }

    .warning {
        background: var(--warning-bg);

        border: 1px solid currentColor;
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 20px;
        font-size: 0.875rem;
    }

    .warning strong { display: block; margin-bottom: 6px; }
    .warning ul { margin: 0; padding-left: 20px; }
    .warning li { margin: 4px 0; }

    .card {
        background: var(--surface);
        border-radius: 14px;
        padding: 24px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
    }

    .drop-area {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 32px 20px;
        text-align: center;
        transition: border-color 0.2s, background 0.2s;
        background: var(--surface-2);
    }

    .drop-area.dragover {
        border-color: var(--primary);
        background: var(--surface);
    }

    .drop-area.error {
        border-color: var(--error);
        animation: shake 0.3s;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }

    .drop-area p {
        margin: 0 0 16px;
        color: var(--text-2);
        font-size: 0.9rem;
    }

    .btn-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn {
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn:active { transform: scale(0.98); }

    .btn.primary {
        background: var(--primary);
        color: var(--on-primary);
    }

    .btn.secondary {
        background: transparent;
        color: var(--text);
        border-color: var(--border);
    }

    .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .btn.block {
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 14px;
        font-size: 0.95rem;
        text-align: center;
        text-decoration: none;
    }

    .file-info {
        margin-top: 16px;
        padding: 10px 14px;
        background: var(--surface-2);
        border-radius: 8px;
        font-size: 0.85rem;
        color: var(--text-2);
        word-break: break-all;
    }

    .progress {
        position: relative;
        height: 8px;
        background: var(--progress-bg);
        border-radius: 999px;
        margin-top: 16px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: var(--primary);
        border-radius: 999px;
        transition: width 0.3s ease;
    }

    .progress-text {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 0.7rem;
        color: var(--text-2);
        background: var(--surface-2);
        padding: 0 4px;
        border-radius: 4px;
    }

    .status {
        margin-top: 16px;
        padding: 12px 14px;
        background: var(--surface-2);
        border-radius: 8px;
        font-size: 0.875rem;
        color: var(--text);

        white-space: pre-wrap;
        word-break: break-word;

    .status.error {

        background: var(--error-bg);
    }

    .status.success {
        color: var(--success);
        background: var(--surface-2);
        font-weight: 600;
    }

    .note {
        margin: 12px 0 0;
        font-size: 0.8rem;
        color: var(--text-2);
    }

    .note.warn { color: var(--warning); }

    .footer {
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
        padding: 16px 20px 32px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--text-2);
    }

    .footer a {
        color: var(--text-2);
        text-decoration: none;
        border-bottom: 1px solid var(--border);
        transition: color 0.2s, border-color 0.2s;
    }

    .footer a:hover {
        color: var(--text);
        border-color: var(--text);
    }

    @media (max-width: 520px) {
        .container { padding: 56px 14px 16px; }
        h1 { font-size: 1.3rem; }
        .card { padding: 16px; }
        .drop-area { padding: 24px 14px; }
        .topbar { top: 10px; right: 10px; }
        .icon-btn { width: 36px; height: 36px; }
        .footer { padding: 12px 14px 24px; }
    }
</style>

            statusDecrypting: 'Decrypting and repacking…',
            statusProcessingFile: 'Processing {done}/{total}',
            statusPacking: 'Building archive…',
            statusDone: 'Decryption complete.',
            processBtn: 'Decrypt',
            processing: 'Processing…',
            downloadBtn: 'Download Decrypted World',
            errFileType: 'Please select a .zip world archive.',
            errNoCurrent: 'CURRENT file not found. Is this a valid NetEase world?',
            errNoManifest: 'MANIFEST file not found. Is this a valid NetEase world?',
            errNotEncrypted: 'This world is not encrypted, or uses an unsupported format.',
            errZipRead: 'Failed to read ZIP. The file may be corrupted.',
            errNoFolderApi: 'Folder selection requires HTTPS or localhost.',
            errFolderPick: 'Failed to choose folder: {msg}',
            errFolderInvalid: 'The folder is missing CURRENT or MANIFEST. Pick the db folder of your world.',
            errUnknown: 'Error: {msg}',
            switchToDark: 'Switch to dark mode',
            switchToLight: 'Switch to light mode',
            langBtn: '中文',
            onlineLabel: 'Live Demo',
            sourceLabel: 'Source'
        }
    };

    /* ========== 加密特征 ========== */
    const SIGNATURES = [
        new Uint8Array([0x80, 0x1D, 0x30, 0x01]),
        new Uint8Array([0x90, 0x1D, 0x30, 0x01])
    ];

    function isEncryptedBlock(bytes) {
        if (!bytes || bytes.length < 4) return false;
        for (const sig of SIGNATURES) {
            let match = true;
            for (let i = 0; i < 4; i++) {
                if (bytes[i] !== sig[i]) { match = false; break; }
            }
            if (match) return true;
        }
        return false;
    }

    function applyStreamCipher(target, key) {
        const klen = key.length;
        if (klen === 0) return target;
        for (let i = 0; i < target.length; i++) {
            target[i] ^= key[i % klen];
        }
        return target;
    }

    function recoverKey(currentCipher, manifestBaseName) {
        if (currentCipher.length <= 4) {
            throw new Error('CURRENT payload too small');
        }
        const nameBytes = new TextEncoder().encode(manifestBaseName);
        const seed = new Uint8Array(nameBytes.length + 1);
        seed.set(nameBytes, 0);
        seed[nameBytes.length] = 0x0A;

        const cipherBody = currentCipher.subarray(4);
        const recovered = new Uint8Array(cipherBody.length);
        for (let i = 0; i < cipherBody.length; i++) {
            recovered[i] = cipherBody[i] ^ seed[i % seed.length];
        }

        if (recovered.length === 16) {
            let identical = true;
            for (let i = 0; i < 8; i++) {
                if (recovered[i] !== recovered[i + 8]) { identical = false; break; }
            }
            if (identical) return recovered.subarray(0, 8);
        }
        return recovered;
    }

    function revealBlock(encryptedBytes, key) {
        const body = encryptedBytes.subarray(4);
        const plain = new Uint8Array(body.length);
        plain.set(body, 0);
        return applyStreamCipher(plain, key);
    }

    /* ========== 状态 ========== */
    const state = {
        file: null,
        dirHandle: null,
        mode: null,
        busy: false,
        status: { key: 'statusIdle', params: {}, type: '' },
        fileInfo: { key: 'noFile', params: {} },
        lastUrl: null
    };

    let lang = localStorage.getItem('wu_lang') ||
        ((navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');
    let theme = localStorage.getItem('wu_theme') || 'light';

    /* ========== DOM ========== */
    const $ = function (id) { return document.getElementById(id); };
    const dropArea = $('dropArea');
    const fileInput = $('fileInput');
    const browseBtn = $('browseBtn');
    const folderBtn = $('folderBtn');
    const folderNote = $('folderNote');
    const fileInfoEl = $('fileInfo');
    const progressBar = $('progressBar');
    const progressText = $('progressText');
    const statusEl = $('status');
    const processBtn = $('processBtn');
    const downloadBtn = $('downloadBtn');
    const themeBtn = $('themeBtn');
    const langBtn = $('langBtn');

    /* ========== i18n ========== */
    function T(key, params) {
        let s = (I18N[lang] && I18N[lang][key]) || key;
        if (params) {
            Object.keys(params).forEach(function (k) {
                s = s.split('{' + k + '}').join(params[k]);
            });
        }
        return s;
    }

    function applyI18n() {
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.title = T('title');

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            const key = el.getAttribute('data-i18n');
            if (I18N[lang] && I18N[lang][key] !== undefined) {
                el.textContent = I18N[lang][key];
            }
        });

        langBtn.textContent = T('langBtn');
        themeBtn.title = theme === 'light' ? T('switchToDark') : T('switchToLight');

        updateFolderNote();
        renderFileInfo();
        renderStatus();
        updateProcessBtn();
    }

    function updateFolderNote() {
        const supported = 'showDirectoryPicker' in window;
        if (!supported) {
            folderNote.textContent = T('folderNoteUnsupported');
            folderNote.classList.add('warn');
            folderBtn.disabled = true;
        } else {
            folderNote.textContent = T('folderNoteSecure');
            folderNote.classList.remove('warn');
            folderBtn.disabled = false;
        }
    }

    /* ========== 主题 ========== */
    function applyTheme() {
        document.documentElement.setAttribute('data-theme', theme);
        themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
        themeBtn.title = theme === 'light' ? T('switchToDark') : T('switchToLight');
        localStorage.setItem('wu_theme', theme);
    }

    /* ========== 渲染辅助 ========== */
    function renderFileInfo() {
        fileInfoEl.textContent = T(state.fileInfo.key, state.fileInfo.params);
    }

    function renderStatus() {
        statusEl.textContent = T(state.status.key, state.status.params);
        statusEl.className = 'status' + (state.status.type ? ' ' + state.status.type : '');
    }

    function setStatus(key, params, type) {
        state.status = { key: key, params: params || {}, type: type || '' };
        renderStatus();
    }

    function setFileInfo(key, params) {
        state.fileInfo = { key: key, params: params || {} };
        renderFileInfo();
    }

    function updateProcessBtn() {
        processBtn.textContent = state.busy ? T('processing') : T('processBtn');
    }

    function setProgress(pct) {
        pct = Math.max(0, Math.min(100, pct));
        progressBar.style.width = pct + '%';
        progressText.textContent = Math.round(pct) + '%';
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function appError(key, params) {
        const e = new Error(T(key, params));
        e.i18nKey = key;
        e.i18nParams = params || {};
        return e;
    }

    /* ========== ZIP 处理 ========== */
    async function processZip(file) {
        if (typeof JSZip === 'undefined') {
            throw appError('errZipRead');
        }

        setProgress(5);
        setStatus('statusReadingZip');

        let zip;
        try {
            zip = await JSZip.loadAsync(file);
        } catch (e) {
            throw appError('errZipRead');
        }

        setProgress(10);
        setStatus('statusScanning');

        const entries = [];
        zip.forEach(function (path, entry) {
            if (!entry.dir) entries.push(entry);
        });

        const currentCandidates = entries.filter(function (e) {
            return e.name.split('/').pop() === 'CURRENT';
        }).sort(function (a, b) {
            return a.name.split('/').length - b.name.split('/').length;
        });

        if (currentCandidates.length === 0) throw appError('errNoCurrent');

        const currentEntry = currentCandidates[0];
        const slash = currentEntry.name.lastIndexOf('/');
        const targetDir = slash >= 0 ? currentEntry.name.slice(0, slash + 1) : '';

        let manifestEntry = null;
        for (let j = 0; j < entries.length; j++) {
            const e = entries[j];
            if (e.name.indexOf(targetDir) !== 0) continue;
            const rest = e.name.slice(targetDir.length);
            if (rest.indexOf('MANIFEST') === 0 && rest.indexOf('/') === -1) {
                manifestEntry = e;
                break;
            }
        }
        if (!manifestEntry) throw appError('errNoManifest');

        setProgress(20);
        setStatus('statusFindingKey');

        const currentData = await currentEntry.async('uint8array');
        if (!isEncryptedBlock(currentData)) throw appError('errNotEncrypted');

        const manifestName = manifestEntry.name.split('/').pop();
        let key;
        try {
            key = recoverKey(currentData, manifestName);
        } catch (e2) {
            throw appError('errNotEncrypted');
        }

        setProgress(30);
        setStatus('statusDecrypting');

        const outZip = new JSZip();
        const total = entries.length;
        let done = 0;

        for (let k = 0; k < entries.length; k++) {
            const entry2 = entries[k];
            let data;
            try {
                data = await entry2.async('uint8array');
            } catch (e3) {
                done++;
                continue;
            }
            const inTarget = entry2.name.indexOf(targetDir) === 0;
            const shouldDecrypt = inTarget && isEncryptedBlock(data);
            outZip.file(entry2.name, shouldDecrypt ? revealBlock(data, key) : data);
            done++;
            setProgress(30 + (done / total) * 55);
            setStatus('statusProcessingFile', { done: done, total: total });
        }

        setProgress(90);
        setStatus('statusPacking');

        const blob = await outZip.generateAsync({
            type: 'blob',
            compression: 'DEFLATE',
            compressionOptions: { level: 1 }
        });

        if (state.lastUrl) URL.revokeObjectURL(state.lastUrl);
        state.lastUrl = URL.createObjectURL(blob);

        const baseName = file.name.replace(/\.zip$/i, '') || 'world';
        downloadBtn.href = state.lastUrl;
        downloadBtn.download = baseName + '_decrypted.zip';
        downloadBtn.style.display = 'block';

        setProgress(100);
        setStatus('statusDone', {}, 'success');
    }

    /* ========== 文件夹处理 ========== */
    async function processDir(handle) {
        setProgress(5);
        setStatus('statusScanning');

        let currentHandle = null;
        let manifestHandle = null;
        const files = [];

        for await (const entry of handle.values()) {
            if (entry.kind !== 'file') continue;
            files.push(entry);
            if (entry.name === 'CURRENT') currentHandle = entry;
            if (!manifestHandle && entry.name.indexOf('MANIFEST') === 0) manifestHandle = entry;
        }

        if (!currentHandle) throw appError('errNoCurrent');
        if (!manifestHandle) throw appError('errNoManifest');

        setProgress(15);
        setStatus('statusFindingKey');

        const currentFile = await currentHandle.getFile();
        const currentData = new Uint8Array(await currentFile.arrayBuffer());
        if (!isEncryptedBlock(currentData)) throw appError('errNotEncrypted');

        let key;
        try {
            key = recoverKey(currentData, manifestHandle.name);
        } catch (e) {
            throw appError('errNotEncrypted');
        }

        setProgress(25);
        setStatus('statusDecrypting');

        const total = files.length;
        let done = 0;

        for (let i = 0; i < files.length; i++) {
            const fh = files[i];
            try {
                const f = await fh.getFile();
                const data = new Uint8Array(await f.arrayBuffer());
                if (isEncryptedBlock(data)) {
                    const out = revealBlock(data, key);
                    const w = await fh.createWritable();
                    await w.write(out);
                    await w.close();
                }
            } catch (e2) {
                // 跳过无法写入的文件
            }
            done++;
            setProgress(25 + (done / total) * 70);
            setStatus('statusProcessingFile', { done: done, total: total });
        }

        setProgress(100);
        setStatus('statusDone', {}, 'success');
    }

    /* ========== 主流程 ========== */
    async function start() {
        if (state.busy) return;
        if (!state.file && !state.dirHandle) return;

        state.busy = true;
        processBtn.disabled = true;
        updateProcessBtn();
        downloadBtn.style.display = 'none';
        setProgress(0);
        setStatus('statusInit');

        try {
            if (state.mode === 'dir') {
                await processDir(state.dirHandle);
            } else {
                await processZip(state.file);
            }
        } catch (err) {
            console.error(err);
            if (err && err.i18nKey) {
                setStatus(err.i18nKey, err.i18nParams, 'error');
            } else {
                setStatus('errUnknown', { msg: (err && err.message) || String(err) }, 'error');
            }
            setProgress(0);
        } finally {
            state.busy = false;
            processBtn.disabled = false;
            updateProcessBtn();
        }
    }

    /* ========== 事件 ========== */
    browseBtn.addEventListener('click', function () {
        fileInput.value = '';
        fileInput.click();
    });

    fileInput.addEventListener('change', function (e) {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    dropArea.addEventListener('dragover', function (e) {
        e.preventDefault();
        dropArea.classList.add('dragover');
    });

    dropArea.addEventListener('dragleave', function () {
        dropArea.classList.remove('dragover');
    });

    dropArea.addEventListener('drop', function (e) {
        e.preventDefault();
        dropArea.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    folderBtn.addEventListener('click', selectFolder);
    processBtn.addEventListener('click', start);

    themeBtn.addEventListener('click', function () {
        theme = theme === 'light' ? 'dark' : 'light';
        applyTheme();
        applyI18n();
    });

    langBtn.addEventListener('click', function () {
        lang = lang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('wu_lang', lang);
        applyI18n();
    });

    function handleFile(file) {
        const isZip = /\.zip$/i.test(file.name) || file.type === 'application/zip';
        if (!isZip) {
            dropArea.classList.add('error');
            setTimeout(function () { dropArea.classList.remove('error'); }, 500);
            setStatus('errFileType', {}, 'error');
            setFileInfo('noFile');
            state.file = null;
            state.dirHandle = null;
            state.mode = null;
            processBtn.disabled = true;
            downloadBtn.style.display = 'none';
            return;
        }

        state.file = file;
        state.dirHandle = null;
        state.mode = 'zip';
        setFileInfo('fileSelected', { name: file.name, size: formatSize(file.size) });
        setStatus('statusFileReady');
        processBtn.disabled = false;
        downloadBtn.style.display = 'none';
        setProgress(0);
    }

    async function selectFolder() {
        if (!('showDirectoryPicker' in window)) {
            setStatus('errNoFolderApi', {}, 'error');
            return;
        }

        let handle;
        try {
            handle = await window.showDirectoryPicker();
        } catch (e) {
            if (e && e.name === 'AbortError') return;
            setStatus('errFolderPick', { msg: (e && e.message) || String(e) }, 'error');
            return;
        }

        let hasCurrent = false;
        let hasManifest = false;
        let count = 0;
        for await (const entry of handle.values()) {
            if (entry.kind === 'file') {
                count++;
                if (entry.name === 'CURRENT') hasCurrent = true;
                if (entry.name.indexOf('MANIFEST') === 0) hasManifest = true;
            }
        }

        if (!hasCurrent || !hasManifest) {
            setStatus('errFolderInvalid', {}, 'error');
            setFileInfo('noFile');
            return;
        }

        state.dirHandle = handle;
        state.file = null;
        state.mode = 'dir';
        setFileInfo('folderSelected', { name: handle.name, count: count });
        setStatus('statusFolderReady');
        processBtn.disabled = false;
        downloadBtn.style.display = 'none';
        setProgress(0);
    }

    /* ========== 初始化 ========== */
    applyTheme();
    applyI18n();

})();
</script>

</body>
</html>
